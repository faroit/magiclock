name: CI

on:
  push:
    branches:
      - master
      - feature/**
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  test:
    name: SwiftPM
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run core tests
        run: swift run MagiclockCoreTestRunner

      - name: Build app
        run: swift build
